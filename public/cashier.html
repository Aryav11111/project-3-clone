<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boba Lounge – Cashier</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="kiosk.css" />
    <link rel="stylesheet" href="cashier.css" />
    <link rel="stylesheet" href="translate.css" />
    <script src="translate.js" defer></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg viewBox="126 64 148 252" width="26" height="44" aria-hidden="true">
          <rect
            x="203"
            y="70"
            width="16"
            height="120"
            rx="3"
            fill="#c4452c"
            stroke="#1d1916"
            stroke-width="5"
            transform="rotate(14 211 160)"
          />
          <path
            d="M146 158 L254 158 L240 300 Q239 310 229 310 L171 310 Q161 310 160 300 Z"
            fill="#d8b48c"
            stroke="#1d1916"
            stroke-width="7"
            stroke-linejoin="round"
          />
          <g fill="#1d1916">
            <circle cx="178" cy="292" r="10" />
            <circle cx="200" cy="296" r="10" />
            <circle cx="222" cy="292" r="10" />
            <circle cx="189" cy="274" r="10" />
            <circle cx="211" cy="274" r="10" />
          </g>
          <rect
            x="134"
            y="152"
            width="132"
            height="13"
            rx="5"
            fill="#f4eee3"
            stroke="#1d1916"
            stroke-width="7"
          />
          <text
            x="200"
            y="236"
            text-anchor="middle"
            font-family="Georgia, serif"
            font-weight="800"
            font-style="italic"
            font-size="58"
            fill="#1d1916"
          >
            42
          </text>
        </svg>
        Boba <em>Lounge</em>
      </div>
      <a class="home-return" href="index.html">← Back to Home</a>
    </header>

    <main class="cashier">
      <div id="menu"></div>

      <aside class="ticket">
        <h2>Current order</h2>
        <div class="label">Sugar</div>
        <div class="options small" id="sugarOptions"></div>
        <div class="label">Ice</div>
        <div class="options small" id="iceOptions"></div>

        <div class="order-lines" id="orderLines"></div>
        <div class="order-total">
          <span>Total</span><span class="price" id="orderTotal">$0.00</span>
        </div>

        <div class="options small" id="paymentOptions"></div>
        <button class="big-btn" id="chargeBtn">Charge</button>
        <button class="clear-btn" id="clearBtn">Clear order</button>
        <div class="message" id="message"></div>
      </aside>
    </main>

    <script src="cashier.js"></script>
  </body>
</html>
